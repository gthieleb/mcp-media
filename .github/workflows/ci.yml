name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: |
          go install mvdan.cc/gofumpt@v0.9.2
          test -z "$(gofumpt -l .)" || { gofumpt -l .; exit 1; }
      # envtest suites (internal/webhook, internal/controller) need the
      # kube-apiserver binaries; setup-envtest provides them.
      - name: Setup envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.35.x -p path)" >> "$GITHUB_ENV"
      - run: go test ./...

  # Per-image build/push job: ONE image per tag push — the tag prefix
  # selects the image (sidecar-v* → mcp-media-sidecar:<git-tag>, etc.).
  # 2026-10-27 fix: was a 4-way matrix that cross-tagged every package on
  # every tag (e.g. mcp-media-sidecar:proxy-v0.2.0) — sidecar/proxy/example
  # tolerated it, the unlinked mcp-media-controller package denied with
  # read_package and marked the run failed even when the correct leg pushed.
  images:
    needs: unit
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sidecar-v') || startsWith(github.ref, 'refs/tags/proxy-v') || startsWith(github.ref, 'refs/tags/example-v') || startsWith(github.ref, 'refs/tags/controller-v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image from tag
        id: resolve
        run: |
          tag="${GITHUB_REF_NAME}"
          image="${tag%%-v*}"
          case "${image}" in
            sidecar|proxy|example|controller) ;;
            *) echo "::error::tag ${tag} does not map to a Dockerfile"; exit 1 ;;
          esac
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gthieleb/mcp-media-${{ steps.resolve.outputs.image }}
          tags: |
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ steps.resolve.outputs.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # envtest / e2e-kind / e2e-k3s jobs are wired in Wave 4 (T4.5).
