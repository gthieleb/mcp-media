name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: |
          go install mvdan.cc/gofumpt@v0.9.2
          test -z "$(gofumpt -l .)" || { gofumpt -l .; exit 1; }
      - run: go test ./...

  # envtest / e2e-kind / e2e-k3s jobs are wired in Wave 4 (T4.5).
  # Image builds for ghcr.io/gthieleb/mcp-media-* are added per-wave as
  # Dockerfiles land (sidecar: Wave 1 T1.8).
