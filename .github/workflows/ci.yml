name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: |
          go install mvdan.cc/gofumpt@v0.9.2
          test -z "$(gofumpt -l .)" || { gofumpt -l .; exit 1; }
      - run: go test ./...

  # Per-image build/push job: triggers on matching tag prefixes.
  #   sidecar-v*  → ghcr.io/gthieleb/mcp-media-sidecar:<git-tag>
  #   proxy-v*    → ghcr.io/gthieleb/mcp-media-proxy:<git-tag>
  #   example-v* → ghcr.io/gthieleb/mcp-media-example:<git-tag>
  # The image tag is the full git tag (e.g. "proxy-v0.1.0") for 1:1 traceability.
  images:
    needs: unit
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sidecar-v') || startsWith(github.ref, 'refs/tags/proxy-v') || startsWith(github.ref, 'refs/tags/example-v')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [sidecar, proxy, example]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gthieleb/mcp-media-${{ matrix.image }}
          tags: |
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # envtest / e2e-kind / e2e-k3s jobs are wired in Wave 4 (T4.5).
